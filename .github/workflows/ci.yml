name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The shell-session tests also run against zsh when it is installed.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install Nova
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Renderer typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      # --ignore-scripts: skips Electron's ~100 MB binary download, which
      # neither the typecheck nor the Vite build needs.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
